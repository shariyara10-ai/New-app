name: Build CineZehn AI Studio Android APK
on:
  push:
    branches: [shari-autocut-standalone]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch pinned Whisper.cpp native source
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper
      - name: Compile standalone debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CineZehn-AI-Studio-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
