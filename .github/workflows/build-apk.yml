name: Build CineZehn PRO Android APK
on:
  push:
    branches: [cinezehn-pro-rebuild]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already has the Android SDK installed; the retired
      # legacy 'tools' sdkmanager package breaks setup-android@v3.
      - name: Verify and prepare installed Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Copy interactive editor into APK assets
        run: |
          mkdir -p app/src/main/assets/web
          cp web/index.html web/styles.css web/app.js web/core.js web/media.js web/whisper.js app/src/main/assets/web/
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload Pixel-compatible APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineZehn-AI-Studio-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
