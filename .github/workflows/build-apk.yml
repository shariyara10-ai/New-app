name: Build CineZehn PRO Android APK
on:
  push:
    branches: [cinezehn-pro-rebuild]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copy interactive editor into APK assets
        run: |
          mkdir -p app/src/main/assets/web
          cp web/index.html web/styles.css web/app.js web/core.js web/media.js web/whisper.js app/src/main/assets/web/
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload Pixel-compatible APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineZehn-AI-Studio-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
