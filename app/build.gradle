plugins { id 'com.android.application' }
android {
 namespace 'com.shari.autocut'
 compileSdk 36
 defaultConfig {
  applicationId 'com.cinezehn.aistudio'
  minSdk 29
  targetSdk 35
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DCMAKE_BUILD_TYPE=Release' } }
  versionCode 14
  versionName '0.7.0-whisper-beta'
 }
 ndkVersion '26.3.11579264'
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
dependencies {
 implementation 'androidx.media3:media3-common:1.11.1'
 implementation 'androidx.media3:media3-effect:1.11.1'
 implementation 'androidx.media3:media3-transformer:1.11.1'
 implementation 'com.alphacephei:vosk-android:0.3.75'
}
